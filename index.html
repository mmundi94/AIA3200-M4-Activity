<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Activity: Architect DoseMate at Scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Red+Hat+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fffbea; --ink:#1f1a2e; --soft:#5d566b;
    --plum:#741b47; --yel:#FFFF02;
    --apri:#ff8c42; --jade:#00a878; --indigo:#3a56ff; --mustard:#e0a800;
    --ok:#1f9d55; --miss:#e63946;
    --sans:"Outfit","Segoe UI",system-ui,sans-serif; --mono:"Red Hat Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100vh;line-height:1.5;position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:-15%;z-index:-2;
    background:
      conic-gradient(from 210deg at 12% 18%, rgba(255,140,66,.45), transparent 30%),
      radial-gradient(34% 30% at 95% 12%, rgba(58,86,255,.38), transparent 70%),
      radial-gradient(38% 34% at 92% 90%, rgba(0,168,120,.40), transparent 70%),
      radial-gradient(36% 30% at 6% 92%, rgba(116,27,71,.30), transparent 70%),
      radial-gradient(28% 24% at 50% 40%, rgba(255,255,2,.22), transparent 70%);
    animation:float 30s ease-in-out infinite alternate}
  @keyframes float{to{transform:translate(1.5%,-1.5%) rotate(1deg)}}
  .grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.32;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12  0 0 0 0 .1  0 0 0 0 .18  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}

  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand b{display:block;font-size:19px;color:var(--plum);font-weight:800}
  .brand span{font-family:var(--mono);font-size:12px;color:var(--soft)}
  .chip{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:var(--yel);color:var(--ink);
    padding:8px 14px;border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}

  /* progress */
  .prog{background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:18px;box-shadow:0 10px 30px -18px rgba(116,27,71,.5)}
  .prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
  .pchip{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 11px 5px 6px;border-radius:999px;background:#f6f3ea;color:var(--soft)}
  .pchip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:11px;background:#e7e1d2;color:var(--ink)}
  .pchip.cur{background:var(--cs);color:var(--ink)} .pchip.cur i{background:var(--c);color:#fff}
  .pchip.done i{background:var(--c);color:#fff}
  .pcount{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700}
  .bar{height:12px;border-radius:12px;background:#f1ecdf;overflow:hidden;display:flex}
  .bar span{height:100%;transition:width .5s ease;background:repeating-linear-gradient(-45deg,var(--c) 0 8px,color-mix(in srgb,var(--c) 75%,#fff) 8px 16px);
    background-size:22px 22px;animation:stripes 1s linear infinite}
  @keyframes stripes{to{background-position:22px 0}}

  .layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
  .layout>*{min-width:0}
  .layout.full{grid-template-columns:minmax(0,1fr)}
  .layout.full .board{display:none}

  .card{background:#fff;border-radius:28px 28px 28px 8px;padding:24px;position:relative;box-shadow:0 18px 40px -24px rgba(31,26,46,.55)}
  .card::before{content:"";position:absolute;left:24px;top:0;width:70px;height:6px;border-radius:0 0 6px 6px;background:var(--sc,var(--plum))}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--sc,var(--plum))}
  h1{font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:8px 0 12px;font-weight:800;letter-spacing:-.8px}
  h2{font-size:clamp(22px,3vw,30px);line-height:1.15;margin:6px 0 10px;font-weight:800}
  h3{font-size:16.5px;margin:0 0 8px}
  .mk{background:var(--yel);padding:0 6px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  p{margin:0 0 12px}
  .lead{font-size:16.5px;color:var(--soft)}
  .floors{display:grid;gap:10px;margin:18px 0}
  .floor{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--cs);position:relative;overflow:hidden}
  .floor .n{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--c);width:30px}
  .floor .ic{flex:0 0 42px;height:42px;border-radius:12px;background:#fff;color:var(--c);display:grid;place-items:center}
  .floor .ic svg{width:26px;height:26px}
  .floor b{display:block} .floor small{color:var(--soft);font-size:12.5px}
  .floor::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:shine 4s infinite;animation-delay:var(--d)}
  @keyframes shine{40%,100%{transform:translateX(100%)}}
  .note{font-size:14px;color:var(--soft)}

  .btn{font-family:var(--sans);font-weight:800;font-size:16px;border:0;cursor:pointer;background:var(--ink);color:#fff;padding:13px 24px;border-radius:999px;
    box-shadow:0 0 0 3px var(--yel) inset;transition:transform .12s, background .12s}
  .btn:hover{transform:translateY(-2px);background:var(--plum)}
  .btn:active{transform:translateY(1px)}
  .btn.alt{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
  .btn:focus-visible,.opt:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}

  .hero-ic{width:78px;height:78px;border-radius:24px;background:var(--sc);color:#fff;display:grid;place-items:center;margin-bottom:10px;animation:bob 3s ease-in-out infinite}
  .hero-ic svg{width:44px;height:44px}
  @keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
  .keys{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
  .key{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--cs);border:1.5px solid var(--c)}

  .qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .pill{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--scs)}
  .prompt{font-size:19px;font-weight:600;line-height:1.4;margin:14px 0 14px;overflow-wrap:anywhere}
  .ask{font-size:14px;font-weight:600;color:var(--soft);margin-bottom:10px}
  .opts{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
  .opt{font-family:var(--sans);text-align:left;cursor:pointer;background:var(--cs);border:2px solid transparent;border-radius:18px;padding:12px;display:flex;align-items:center;gap:11px;
    font-size:15.5px;font-weight:600;color:var(--ink);transition:transform .12s,box-shadow .12s}
  .opt .oi{flex:0 0 40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
  .opt .oi svg{width:24px;height:24px}
  .opt small{display:block;font-weight:400;font-size:12px;color:var(--soft)}
  .opt:hover:not([disabled]){transform:translateY(-2px);box-shadow:0 8px 18px -10px var(--c)}
  .opt[disabled]{cursor:default}
  .opt.dim{opacity:.38}
  .opt.mine.right{border-color:var(--ok);background:#e5f5ec}
  .opt.mine.wrong{border-color:var(--miss);background:#fde6e8}
  .opt.truth{border-color:var(--ok);border-style:dashed;background:#f0faf4}
  .tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .opt{position:relative}
  .opts.c3 .tag{position:absolute;top:-10px;right:10px;margin:0}
  .tag.ok{background:var(--ok);color:#fff}.tag.no{background:var(--miss);color:#fff}.tag.ans{background:#fff;color:var(--ok);border:1.5px solid var(--ok)}
  .status{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:#faf6e8}
  .status .m{display:flex;align-items:center;gap:10px;font-weight:600}
  .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
  .dot.ok{background:var(--ok)}.dot.no{background:var(--miss)}

  /* board */
  .board{position:sticky;top:14px;background:#fff;border-radius:28px 8px 28px 28px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(58,86,255,.6)}
  .bhead{display:flex;align-items:center;gap:10px;padding:13px 16px;background:linear-gradient(90deg,var(--plum),#4a1030);color:#fff}
  .bhead b{font-size:14.5px}
  .bhead .pulse{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--yel)}
  .bhead .pulse i{width:8px;height:8px;border-radius:50%;background:var(--yel);animation:beat 1.3s infinite}
  @keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.5);opacity:.4}}
  .bbody{padding:16px;min-height:300px;background:radial-gradient(circle at 1px 1px,rgba(31,26,46,.12) 1px,transparent 1.5px) 0 0/16px 16px}
  .bcap{padding:12px 16px;border-top:1px solid #f0ead8;font-size:13.5px;color:var(--soft);min-height:46px}
  .bcap b{color:var(--ink)}
  .flash-bad{animation:fbad .9s ease}
  @keyframes fbad{0%,100%{box-shadow:none}30%,70%{box-shadow:0 0 0 4px var(--miss)}}
  .pop{animation:pop .6s ease}
  @keyframes pop{40%{transform:scale(1.07)}}

  /* tiers */
  .tiers{display:grid;gap:10px;position:relative}
  .tier{border-radius:16px;padding:10px 12px;background:var(--cs);border:2px solid var(--c);min-height:78px;position:relative}
  .tier h4{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:14px}
  .tier h4 span{width:26px;height:26px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center}
  .tier h4 svg{width:17px;height:17px}
  .tier h4 em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--soft);margin-left:auto}
  .slots{display:flex;flex-wrap:wrap;gap:6px}
  .fcard{font-size:12px;font-weight:600;background:#fff;border-radius:8px;padding:4px 8px 4px 20px;position:relative;box-shadow:0 2px 0 var(--c)}
  .fcard::before{content:"";position:absolute;left:7px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .fcard.no::before{background:transparent;border:2px solid var(--miss);width:5px;height:5px}
  .fcard.drop{animation:drop .7s cubic-bezier(.2,1.4,.4,1)}
  @keyframes drop{from{transform:translateY(-120px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  .link-v{height:10px;margin:-6px auto;width:4px;background:repeating-linear-gradient(var(--soft) 0 4px,transparent 4px 8px);background-size:4px 8px;animation:vflow .6s linear infinite;opacity:.5}
  @keyframes vflow{to{background-position:0 8px}}

  /* blocks */
  .grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .blk{border-radius:16px;padding:12px 10px;text-align:center;background:#fff;border:2px dashed #d9d2c0;color:var(--soft);transition:background .4s,color .4s,border-color .4s}
  .blk .bi{width:40px;height:40px;margin:0 auto 6px;border-radius:12px;display:grid;place-items:center;background:#f4f0e3;color:var(--c)}
  .blk .bi svg{width:24px;height:24px}
  .blk b{display:block;font-size:12.5px;color:var(--ink);line-height:1.2}
  .blk small{font-family:var(--mono);font-size:10.5px}
  .blk.lit{background:var(--cs);border:2px solid var(--c);color:var(--ink)}
  .blk.lit .bi{background:var(--c);color:#fff}
  .plat{border:2px solid var(--ink);border-radius:18px;padding:12px;margin-top:12px;text-align:center;font-family:var(--mono);font-size:12px;background:#fffdf3}
  .paths{display:grid;gap:10px}
  .path{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--cs);border:2px solid var(--c);transition:opacity .4s}
  .path .bi{flex:0 0 40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center}
  .path .bi svg{width:24px;height:24px}
  .path b{display:block;font-size:14px}
  .path small{font-size:12px;color:var(--soft)}
  .path.fade{opacity:.35}
  .path.win{box-shadow:0 0 0 4px var(--ok)}

  /* twin */
  .sync{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:6px;margin-bottom:14px}
  .tw{border-radius:14px;padding:10px;background:#fff;border:2px solid var(--plum);text-align:center}
  .tw b{display:block;font-size:13px}
  .tw small{font-family:var(--mono);font-size:10.5px;color:var(--soft)}
  .tw.ghost{border-style:dashed;background:#fbf2f6}
  .beam{height:24px;position:relative;overflow:hidden}
  .beam::before{content:"";position:absolute;left:0;right:0;top:11px;height:2px;background:rgba(116,27,71,.25)}
  .beam i{position:absolute;top:7px;width:10px;height:10px;border-radius:50%;background:var(--plum);animation:zip 1.6s linear infinite}
  .beam i:nth-child(2){animation-delay:.53s}.beam i:nth-child(3){animation-delay:1.06s}
  @keyframes zip{from{left:-10px}to{left:100%}}
  .beam.broken::before{background:repeating-linear-gradient(90deg,var(--miss) 0 5px,transparent 5px 9px)}
  .beam.broken i{display:none}
  .nest{position:relative;border-radius:18px;padding:22px 10px 10px;border:2px solid var(--c);background:var(--cs);transition:box-shadow .4s}
  .nest>.nl{position:absolute;top:4px;left:12px;font-size:11.5px;font-weight:700;font-family:var(--mono);color:var(--c);text-transform:uppercase;letter-spacing:.4px}
  .nest.glow{box-shadow:0 0 0 4px var(--c),0 0 24px 4px var(--c);animation:pop .6s ease}
  .nest .inner{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 0}
  .nest .inner svg{width:28px;height:28px}

  /* calc */
  .counter{text-align:center;padding:18px 10px;border-radius:20px;background:#fff;border:2px solid var(--indigo)}
  .counter .eq{font-family:var(--mono);font-size:13px;color:var(--soft)}
  .counter .big{font-size:46px;font-weight:800;color:var(--indigo);line-height:1.1;font-variant-numeric:tabular-nums}
  .counter .unit{font-size:13px;font-weight:600}
  .bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
  .bin{border-radius:14px 14px 18px 18px;border:2px solid var(--c);background:var(--cs);min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:8px;position:relative;overflow:hidden}
  .bin b{font-size:14px} .bin small{font-size:11px;color:var(--soft);text-align:center}
  .bin .bi{width:34px;height:34px;color:var(--c)} .bin .bi svg{width:34px;height:34px}
  .datablk{position:absolute;top:-40px;left:50%;width:46px;height:26px;margin-left:-23px;border-radius:7px;background:var(--c);border:2px solid var(--ink);animation:fall .9s cubic-bezier(.3,1.3,.5,1) forwards}
  @keyframes fall{to{top:42px}}
  .bars5{display:flex;align-items:flex-end;gap:10px;height:170px;padding:0 4px;border-bottom:2px solid var(--ink)}
  .b5{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .b5 i{width:100%;border-radius:8px 8px 0 0;background:var(--c);height:0;transition:height .9s cubic-bezier(.2,1,.3,1)}
  .b5.hl i{box-shadow:0 0 0 3px var(--yel),0 0 0 5px var(--ink)}
  .b5lab{display:flex;gap:10px;padding:6px 4px 0}
  .b5lab span{flex:1;text-align:center;font-size:11px;font-weight:600}
  .chartbox svg{width:100%;height:auto;display:block}
  .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* final */
  .rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 22px}
  .ring{text-align:center;border-radius:20px;padding:12px;background:var(--cs)}
  .ring svg{width:92px;height:92px}
  .ring circle.v{transition:stroke-dashoffset 1.2s ease}
  .ring b{display:block;font-size:13.5px}
  .sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:22px}
  .sum{border-radius:18px;padding:12px 14px;background:#fffdf5;border:2px solid var(--c)}
  .sum h3{color:var(--c)}
  .sum ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .sum li{display:flex;gap:8px;font-size:13.5px;align-items:baseline}
  .sum li i{flex:0 0 10px;height:10px;border-radius:50%;background:var(--ok);transform:translateY(1px)}
  .sum li i.no{background:transparent;border:2px solid var(--miss)}
  .sum li em{font-style:normal;color:var(--soft);font-size:12.5px}
  .ideas{list-style:none;margin:0 0 22px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .ideas li{padding:14px;border-radius:18px;background:var(--cs);font-size:15px;position:relative;padding-left:52px}
  .ideas li::before{content:attr(data-n);position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin:-8px 0 16px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}.board{position:static}.rings{grid-template-columns:repeat(2,minmax(0,1fr))}.sumgrid,.ideas{grid-template-columns:1fr}}
  @media (max-width:600px){.card{padding:18px}.opts{grid-template-columns:1fr!important}.prompt{font-size:17px}.grid6{grid-template-columns:repeat(2,minmax(0,1fr))}.pcount{margin-left:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.datablk{top:42px}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Nexford University</b><span>AIA3200 · Foundations of Robotics and IoT</span></div>
    <span class="chip">Practice Activity · Module 4</span>
  </header>
  <div class="prog" id="prog" aria-label="Progress"></div>
  <main class="layout" id="layout">
    <section class="card" id="stage" aria-live="polite"></section>
    <aside class="board" aria-label="Architecture board">
      <div class="bhead"><b id="btitle">Architecture Board</b><span class="pulse"><i></i>LIVE</span></div>
      <div class="bbody" id="bbody"></div>
      <div class="bcap" id="bcap"></div>
    </aside>
  </main>
</div>

<script>
(function(){
  "use strict";
  var REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var P='viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  var G={
    device:'<path d="M9 27h14"/><rect x="9" y="5" width="14" height="18" rx="4"/><path d="M12 11h8l-1 6h-6z"/><circle cx="20" cy="8" r="1" fill="currentColor"/>',
    hub:'<path d="M6 14l10-8 10 8"/><rect x="8" y="16" width="16" height="10" rx="2"/><path d="M12 21h2M18 21h2"/>',
    cloud:'<path d="M9 23h15a5 5 0 0 0 .5-10A8 8 0 0 0 9.2 12 5.5 5.5 0 0 0 9 23z"/><path d="M12 18h9"/>',
    mgmt:'<rect x="5" y="6" width="10" height="8" rx="2"/><rect x="5" y="18" width="10" height="8" rx="2"/><path d="M19 10h8M19 22h8"/><path d="M8 10l1.5 1.5L12 9"/>',

      $bb.innerHTML='<div class="chartbox"><svg viewBox="0 0 320 200" role="img" aria-label="Cost against number of patients"><line x1="30" y1="10" x2="30" y2="180" stroke="#1f1a2e" stroke-width="2"/><line x1="30" y1="180" x2="310" y2="180" stroke="#1f1a2e" stroke-width="2"/>'+
        '<text x="170" y="196" text-anchor="middle" font-size="11" font-family="Outfit, sans-serif" fill="#5d566b">Number of patients</text><text x="14" y="100" text-anchor="middle" font-size="11" font-family="Outfit, sans-serif" fill="#5d566b" transform="rotate(-90 14 100)">Cost</text>'+
        (fresh?'<path class="draw" d="'+paths[it.a]+'" fill="none" stroke="'+o.c+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>':'<text x="170" y="100" text-anchor="middle" font-size="40" font-family="Outfit, sans-serif" fill="#d9d2c0">?</text>')+'</svg></div>';
      cap(fresh?"This cost <b>"+o.label.toLowerCase()+"</b>. A pilot hides fixed costs, so show Dana the cost per patient at each scale.":"Some costs grow with every patient, some are mostly fixed, and some grow in steps.");
    }
  };
  function cap(t){$bc.innerHTML=t;}
  function idle(){
    $bt.textContent="Architecture Board";
    $bb.innerHTML='<div class="tiers">'+[["cloud","In the cloud"],["hub","Home hub"],["device","On the device"]].map(function(t,ix){var o=find(PLACE,t[0]);return (ix?'<div class="link-v"></div>':'')+'<div class="tier" style="--c:'+o.c+';--cs:'+o.cs+'"><h4><span>'+ic(o.icon)+'</span>'+t[1]+'</h4><div class="slots"><span class="fcard drop" style="--c:'+o.c+';animation-delay:'+(ix*.25)+'s">DoseMate</span></div></div>';}).join("")+'</div>';
    cap("From one dispenser to 5,000 patients: where it thinks, what runs it, how it stays in sync, and what it costs.");
  }

  /* ---------- screens ---------- */
  function renderProg(){
    var chips=STATIONS.map(function(s,si){
      var cls="pchip"+((st.screen==="brief"||st.screen==="item")&&si===st.s?" cur":"")+((st.screen==="final"||si<st.s)&&st.screen!=="intro"?" done":"");
      return '<span class="'+cls+'" style="--c:'+s.c+';--cs:'+s.cs+'"><i>'+(si+1)+'</i>'+s.short+'</span>';
    }).join("");
    var segs=STATIONS.map(function(s,si){var n=st.res[si].filter(Boolean).length;return '<span style="--c:'+s.c+';width:'+(100*n/TOTAL)+'%"></span>';}).join("");
    $prog.innerHTML='<div class="prow">'+chips+'<span class="pcount">'+done()+' / '+TOTAL+'</span></div><div class="bar" aria-hidden="true">'+segs+'</div>';
  }
  function setS(s){$stage.style.setProperty("--sc",s?s.c:"#741b47");$stage.style.setProperty("--scs",s?s.cs:"#f7e6ee");}

  function intro(){
    setS(null); idle();
    var f=STATIONS.map(function(s,si){return '<div class="floor" style="--c:'+s.c+';--cs:'+s.cs+';--d:'+(si*.6)+'s"><span class="n">0'+(si+1)+'</span><span class="ic">'+ic(s.icon)+'</span><div><b>'+s.name+'</b><small>'+s.items.length+' items</small></div></div>';}).join("");
    $stage.innerHTML='<div class="eyebrow">Practice Activity · Edge, Cloud, and Data</div><h1>Architect DoseMate <span class="mk">at Scale</span></h1>'+
      '<p class="lead">Dana is planning a 500-patient pilot and wants to grow to 5,000. She needs to know where the data goes, who looks after it, and what it costs every year. Grace wants a straight answer for patients about what is sent to the internet. Work through four stations, and watch the Architecture Board build as you go.</p>'+
      '<div class="floors">'+f+'</div><p class="note">You get one attempt per item. Your answer is recorded, and you move on. About 15 to 20 minutes.</p><button class="btn" id="go">Start Station 1</button>';
    $("go").onclick=function(){st.screen="brief";st.s=0;render(true);};
  }
  function brief(){
    var s=STATIONS[st.s]; setS(s); $bt.textContent=s.board;
    var seen={},k="";s.items.forEach(function(it){it.opts.forEach(function(o){if(!seen[o.key]){seen[o.key]=1;k+='<span class="key" style="--c:'+o.c+';--cs:'+o.cs+'">'+o.label+'</span>';}});});
    $stage.innerHTML='<div class="hero-ic">'+ic(s.icon)+'</div><div class="eyebrow">Station '+(st.s+1)+' of '+STATIONS.length+'</div><h2>'+s.name+'</h2><p class="lead">'+esc(s.brief)+'</p><div class="keys">'+k+'</div><button class="btn" id="go">Begin '+s.items.length+' items</button>';
    $("go").onclick=function(){st.screen="item";st.i=0;render(true);};
    SC[s.items[0].scene](s.items[0],null,false);
  }
  function item(fresh){
    clearT();
    var s=STATIONS[st.s],it=s.items[st.i],r=st.res[st.s][st.i]; setS(s); $bt.textContent=s.board;
    var opts=it.opts.map(function(o){
      var c="opt",t="";
      if(r){if(o.key===r.k){c+=" mine "+(r.ok?"right":"wrong");t='<span class="tag '+(r.ok?"ok":"no")+'">Your answer</span>';}else if(o.key===it.a){c+=" truth";t='<span class="tag ans">Answer</span>';}else c+=" dim";}
      return '<button class="'+c+'" data-k="'+o.key+'" style="--c:'+o.c+';--cs:'+o.cs+'"'+(r?" disabled":"")+'><span class="oi">'+ic(o.icon)+'</span><span>'+o.label+(o.sub&&o.icon!=="num"?'<small>'+o.sub+'</small>':'')+'</span>'+t+'</button>';
    }).join("");
    var cols=it.cols||(it.opts.length===2?2:(it.opts.length===6?2:2));
    var last=st.i===s.items.length-1,nx=last?(st.s===STATIONS.length-1?"See your architecture review":"Go to Station "+(st.s+2)):"Next item";
    var stat=r?'<div class="status"><div class="m">'+(r.ok?'<span class="dot ok" aria-hidden="true">&#10003;</span>Recorded as correct.':'<span class="dot no" aria-hidden="true">&#215;</span>Recorded as incorrect. The answer is '+esc(find(it.opts,it.a).label)+'.')+'</div><button class="btn" id="next">'+nx+'</button></div>':"";
    $stage.innerHTML='<div class="qtop"><div class="eyebrow">Station '+(st.s+1)+' · '+s.name+'</div><span class="pill">Item '+(st.i+1)+' of '+s.items.length+'</span></div><div class="prompt">'+esc(it.q)+'</div><div class="ask">'+(it.ask||s.ask)+'</div><div class="opts'+(cols===3?' c3':'')+'" style="--cols:'+cols+'">'+opts+'</div>'+stat;
    if(!r){Array.prototype.forEach.call($stage.querySelectorAll(".opt"),function(b){b.onclick=function(){choose(b.getAttribute("data-k"));};});SC[it.scene](it,null,false);}
    else{var n=$("next");n.onclick=advance;n.focus({preventScroll:true});SC[it.scene](it,r.k,!!fresh);}
  }
  function choose(k){if(st.res[st.s][st.i])return;var it=STATIONS[st.s].items[st.i];st.res[st.s][st.i]={k:k,ok:k===it.a};renderProg();item(true);}
  function advance(){var s=STATIONS[st.s];if(st.i<s.items.length-1)st.i++;else if(st.s<STATIONS.length-1){st.s++;st.i=0;st.screen="brief";}else st.screen="final";render(true);}

  function fin(){
    setS(null); clearT();
    var right=0;
    var rings=STATIONS.map(function(s,si){
      var c=st.res[si].filter(function(r){return r&&r.ok;}).length;right+=c;var L=2*Math.PI*36,off=L*(1-c/s.items.length);
      return '<div class="ring" style="--cs:'+s.cs+'"><svg viewBox="0 0 92 92" role="img" aria-label="'+c+' of '+s.items.length+'"><circle cx="46" cy="46" r="36" fill="none" stroke="#fff" stroke-width="10"/>'+
        '<circle class="v" cx="46" cy="46" r="36" fill="none" stroke="'+s.c+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+L.toFixed(1)+'" stroke-dashoffset="'+L.toFixed(1)+'" data-off="'+off.toFixed(1)+'" transform="rotate(-90 46 46)"/>'+
        '<text x="46" y="52" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="800" font-size="18" fill="#1f1a2e">'+c+'/'+s.items.length+'</text></svg><b>'+s.name+'</b></div>';
    }).join("");
    var sums=STATIONS.map(function(s,si){
      var li=s.items.map(function(it,ii){var r=st.res[si][ii];return '<li><i class="'+(r&&r.ok?"":"no")+'"></i><span>'+esc(it.log)+' <em>· '+esc(find(it.opts,it.a).label)+'</em></span></li>';}).join("");
      return '<div class="sum" style="--c:'+s.c+'"><h3>'+(si+1)+'. '+s.name+'</h3><ul>'+li+'</ul></div>';
    }).join("");
    var ideas=IDEAS.map(function(d,i){return '<li data-n="0'+(i+1)+'" style="--c:'+d.c+';--cs:'+d.cs+'">'+esc(d.t)+'</li>';}).join("");
    $stage.innerHTML='<div class="eyebrow">Practice Activity complete</div><h1>Architecture <span class="mk">Review</span></h1>'+
      '<p class="lead">You recorded '+right+' of '+TOTAL+' items as correct. Use this review as you place DoseMate\'s functions, recommend a platform, and build the cost model in your Module 4 assignment.</p>'+
      '<div class="rings">'+rings+'</div><div class="legend"><span><i style="width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block"></i>Recorded as correct</span><span><i style="width:10px;height:10px;border-radius:50%;border:2px solid var(--miss);display:inline-block"></i>Recorded as incorrect</span></div>'+
      '<div class="sumgrid">'+sums+'</div><h3>Four ideas to carry into your platform recommendation and cost model</h3><ul class="ideas">'+ideas+'</ul><button class="btn alt" id="again">Start again</button>';
    later(function(){Array.prototype.forEach.call($stage.querySelectorAll("circle.v"),function(c){c.setAttribute("stroke-dashoffset",c.getAttribute("data-off"));});},80);
    $("again").onclick=function(){reset();render(true);};
  }
  function render(top){
    $layout.className="layout"+(st.screen==="final"?" full":"");
    renderProg();
    if(st.screen==="intro")intro();else if(st.screen==="brief")brief();else if(st.screen==="item")item(false);else fin();
    if(top){try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);} if(st.screen!=="item"){var b=$stage.querySelector(".btn");if(b)b.focus({preventScroll:true});}}
  }
  render(false);
})();
</script>
</body>
</html>
